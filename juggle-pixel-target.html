<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#030703">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <title>ジャグ連ドット絵完成イメージ | ICHIGEKI</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #030703;
      --panel: #081108;
      --line: rgba(110, 255, 82, 0.34);
      --text: #f2f7ef;
      --muted: #9ca89b;
      --green: #70ff4f;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 50% 0%, rgba(95, 255, 71, 0.18), transparent 32rem),
        linear-gradient(180deg, #061006 0%, var(--bg) 52%, #010301 100%);
    }

    .page {
      width: min(760px, 100%);
      margin: 0 auto;
      padding: 14px 10px 34px;
    }

    .header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 12px;
      padding: 6px 2px 14px;
    }

    .brand {
      color: inherit;
      text-decoration: none;
    }

    .brand strong {
      display: block;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: clamp(24px, 8vw, 42px);
      line-height: 1;
      letter-spacing: 0.08em;
    }

    .brand span,
    .meta {
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
    }

    .preview {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: rgba(4, 10, 4, 0.92);
      box-shadow:
        0 0 0 1px rgba(112, 255, 79, 0.1) inset,
        0 22px 80px rgba(0, 0, 0, 0.48);
    }

    .preview img {
      display: block;
      width: 100%;
      height: auto;
      background: #020402;
    }

    .actions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-top: 14px;
    }

    .button {
      display: grid;
      place-items: center;
      min-height: 52px;
      border: 1px solid var(--line);
      border-radius: 16px;
      color: var(--text);
      background: rgba(8, 17, 8, 0.88);
      text-decoration: none;
      font-weight: 900;
    }

    .button.primary {
      color: #031003;
      border-color: transparent;
      background: var(--green);
    }

    @media (max-width: 520px) {
      .page {
        padding: 10px 0 24px;
      }

      .header,
      .actions {
        padding-left: 12px;
        padding-right: 12px;
      }

      .preview {
        border-left: 0;
        border-right: 0;
        border-radius: 0;
      }

      .actions {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="header">
      <a class="brand" href="index.html">
        <strong>ICHIGEKI</strong>
        <span>90%完成イメージ</span>
      </a>
      <span class="meta">ドット絵UI案</span>
    </header>

    <section class="preview" aria-label="ジャグ連ドット絵完成イメージ">
      <img src="assets/ui-preview/juggle-pixel-target-90.png" alt="ジャグ連ランキングページをドット絵ゲーム風にした90%完成イメージ">
    </section>

    <nav class="actions" aria-label="ページ移動">
      <a class="button primary" href="juggle-simple.html">現在のページを見る</a>
      <a class="button" href="juggle-game-preview.html">他の案を見る</a>
    </nav>
  </main>
</body>
</html>
