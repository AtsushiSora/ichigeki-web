<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#050705">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <title>ジャグ連ゲームUI案 | ICHIGEKI</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #050705;
      --panel: #101811;
      --line: rgba(142, 255, 122, 0.24);
      --text: #f4f6f0;
      --muted: #a5ada5;
      --green: #8eff7a;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 50% 0%, rgba(90, 255, 92, 0.15), transparent 30rem),
        linear-gradient(180deg, #061006 0%, #050705 52%, #030403 100%);
    }

    .page {
      width: min(760px, 100%);
      margin: 0 auto;
      padding: 18px 14px 42px;
    }

    .header {
      display: grid;
      gap: 8px;
      padding: 8px 2px 18px;
    }

    .brand {
      color: inherit;
      text-decoration: none;
      width: fit-content;
    }

    .brand strong {
      display: block;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: clamp(28px, 9vw, 48px);
      line-height: 1;
      letter-spacing: 0.08em;
    }

    .brand span,
    .lead {
      color: var(--muted);
      font-weight: 800;
      line-height: 1.7;
    }

    h1 {
      margin: 8px 0 0;
      font-size: clamp(24px, 7vw, 38px);
      line-height: 1.18;
    }

    .preview-card {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 24px;
      background: rgba(10, 16, 11, 0.92);
      box-shadow: 0 22px 80px rgba(0, 0, 0, 0.42);
    }

    .preview-card img {
      display: block;
      width: 100%;
      height: auto;
      background: #050705;
    }

    .note {
      margin: 16px 0 0;
      padding: 14px 16px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(10, 16, 11, 0.82);
      color: var(--muted);
      font-weight: 800;
      line-height: 1.75;
    }

    .actions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-top: 16px;
    }

    .button {
      display: grid;
      place-items: center;
      min-height: 54px;
      border: 1px solid var(--line);
      border-radius: 18px;
      color: var(--text);
      background: rgba(12, 18, 13, 0.9);
      text-decoration: none;
      font-weight: 900;
    }

    .button.primary {
      color: #061006;
      border-color: transparent;
      background: var(--green);
    }

    @media (max-width: 520px) {
      .page {
        padding: 14px 10px 34px;
      }

      .preview-card {
        border-radius: 18px;
      }

      .actions {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="header">
      <a class="brand" href="index.html">
        <strong>ICHIGEKI</strong>
        <span>ジャグ連ゲームUI案</span>
      </a>
      <h1>中央エリアのゲーム感イメージ</h1>
      <p class="lead">通常のゲーム機風案と、ドット絵・レトロゲーム風案を比較できます。</p>
    </header>

    <section class="preview-card" aria-label="ジャグ連ゲームUI案">
      <img src="assets/ui-preview/juggle-game-center.png" alt="ジャグ連ページ中央エリアをゲーム風にしたUIイメージ">
    </section>

    <p class="note">案1: ネオンゲーム機風。実装する場合は「結果カード」「STARTボタン」「待機中カード」の3点をCSSで再現するのが現実的です。</p>

    <section class="preview-card" aria-label="ジャグ連ドット絵UI案">
      <img src="assets/ui-preview/juggle-pixel-game.png" alt="ジャグ連ページをドット絵レトロゲーム風にしたUIイメージ">
    </section>

    <p class="note">案2: ドット絵・レトロゲーム風。全体に使うより、結果カードやボタンだけに混ぜる方が読みやすさを保てます。</p>

    <nav class="actions" aria-label="ページ移動">
      <a class="button primary" href="juggle-simple.html">ジャグ連ページへ</a>
      <a class="button" href="color-preview.html">カラー候補へ</a>
    </nav>
  </main>
</body>
</html>
